
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fly High Ventures Blog</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="nav_bar container">
            <div class="nav_bar_left container nav_prop">
                <img src="images/logo.png" alt="logo" width="100px" height="70px">
            </div>

            <div class="nav_bar_middle container nav_prop">
                <a class="nav_link" href="#">Home</a>
                <a class="nav_link" href="#">Articles</a>
                <a class="nav_link" href="#">News</a>
                <a class="nav_link" href="#">Personal</a>
                <a class="nav_link" href="#">Innovations</a>
                <a class="nav_link" href="#">Opportunities</a>
            </div>

            <div class="nav_bar_right container nav_prop">
                <search>
                    <form action="/search" method="get">
                        <input type="search" name="q" placeholder="Type to search">
                        <button type="submit">🔎</button>
                    </form>
                </search>
                <select id="language">
                    <option value="en">🇬🇧</option>
                </select> 
            </div>   
        </nav>
        <header class="Header container" >
            <div class="hero_title container">
                <p id="hero_text">Fly-High <span id="hero_blog">Blog</span></p>    
                <div id="styled_hero_text">Ventures</div>
                <p id="intro">Make your ideas an experience by being current with Tech TRENDS!</p>
            </div>
            
            <div class="adverts container"><!--This will be animated to flip(flicker) at 0.5 secs-->
                <a href="#"><img src="images/fly-high-1.jpeg"></a>
                <!--this will be for the pictures and their titles underneath-->
            </div>
        </header>
        
        <div class="headlines container"> <!--This will be animated to scroll from left to right at 0.5 secs-->
            <div class="headline_cards">
                <img src="#" alt="headline image"><!--this will be for the pictures and their titles underneath-->
            </div>

            <div class="categories">
                <a href="#">AI</a>
                <a href="#">IOT</a>
                <a href="#">INNOVATION</a>
                <a href="#">RANDOM</a>
            </div>
        </div>

        <main class="container">
            <div class="news">
                <div class="news_cards">

                </div>
                <div class="videos">
                    <!--Here will be for embedding video links-->
                </div>
            </div>

        </main>

        <footer class="container">
            <div id="contacts">
                <!--This will be for emails, address and mobile-->
            </div>
            <div id="socials">
                <!--for all social media handles-->
            </div>
            <div id="policies">
                <!--This will be for all policies and cookies, terms of use-->
            </div>
        </footer>
        
    </body>
    <script src="script.js"></script>
</html>
